<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agendamento - Barbearia VIP</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #121212;
      color: #e0e0e0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background-color: #1e1e1e;
      border-radius: 12px;
      padding: 25px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
      border: 1px solid #333;
    }

    /* ESTILO DA IMAGEM NO TOPO */
    .foto-topo {
      width: 100%;
      max-height: 260px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 20px;
      border: 2px solid #d4af37; /* Borda dourada em volta da foto */
    }

    h1, h2 {
      text-align: center;
      color: #d4af37; /* Cor Ouro */
      margin-bottom: 20px;
    }

    h2 {
      font-size: 1.2rem;
      margin-top: 25px;
      border-bottom: 1px solid #333;
      padding-bottom: 10px;
    }

    .campo {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-size: 0.9rem;
      color: #aaa;
    }

    input, select {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #444;
      background-color: #2a2a2a;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }

    input:focus, select:focus {
      border-color: #d4af37;
    }

    button.btn-agendar {
      width: 100%;
      padding: 12px;
      background-color: #d4af37;
      color: #121212;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 10px;
    }

    button.btn-agendar:hover {
      background-color: #b5922e;
    }

    .lista-agendamentos {
      margin-top: 15px;
      max-height: 250px;
      overflow-y: auto;
    }

    .item-agendamento {
      background-color: #2a2a2a;
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 10px;
      border-left: 4px solid #d4af37;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .info p {
      font-size: 0.85rem;
      color: #ccc;
      margin-top: 3px;
    }

    .info strong {
      color: #fff;
      font-size: 1rem;
    }

    .btn-cancelar {
      background: #ff4d4d;
      color: #fff;
      border: none;
      padding: 6px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .btn-cancelar:hover {
      background: #cc0000;
    }

    .vazio {
      text-align: center;
      color: #666;
      font-size: 0.9rem;
      padding: 10px;
    }
  </style>
</head>
<body>

  <div class="card">
    <img src="foto-corte.jpg" alt="Corte de Cabelo Barbearia" class="foto-topo">

    <h1>💈 Barbearia VIP</h1>

    <form id="agendamentoForm">
      <div class="campo">
        <label for="nome">Nome Completo</label>
        <input type="text" id="nome" required placeholder="Digite seu nome">
      </div>

      <div class="campo">
        <label for="telefone">WhatsApp / Telefone</label>
        <input type="tel" id="telefone" required placeholder="(00) 00000-0000">
      </div>

      <div class="campo">
        <label for="servico">Serviço</label>
        <select id="servico" required>
          <option value="">Selecione o serviço...</option>
          <option value="Corte de Cabelo">Corte de Cabelo - R$ 35,00</option>
          <option value="Barba">Barba - R$ 25,00</option>
          <option value="Cabelo + Barba">Cabelo + Barba - R$ 50,00</option>
        </select>
      </div>

      <div class="campo">
        <label for="data">Data</label>
        <input type="date" id="data" required>
      </div>

      <div class="campo">
        <label for="hora">Horário</label>
        <input type="time" id="hora" required>
      </div>

      <button type="submit" class="btn-agendar">Confirmar Agendamento</button>
    </form>

    <h2>Horários Agendados</h2>
    <div id="lista" class="lista-agendamentos"></div>
  </div>

  <script>
    const form = document.getElementById('agendamentoForm');
    const listaContainer = document.getElementById('lista');

    // Função para buscar agendamentos salvos no navegador
    function obterAgendamentos() {
      return JSON.parse(localStorage.getItem('barbearia_agendamentos')) || [];
    }

    // Função para renderizar os agendamentos na tela
    function renderizarAgendamentos() {
      const agendamentos = obterAgendamentos();
      listaContainer.innerHTML = '';

      if (agendamentos.length === 0) {
        listaContainer.innerHTML = '<div class="vazio">Nenhum horário agendado.</div>';
        return;
      }

      agendamentos.forEach((item, index) => {
        // Formata a data (YYYY-MM-DD -> DD/MM/YYYY)
        const [ano, mes, dia] = item.data.split('-');
        const dataFormatada = `${dia}/${mes}/${ano}`;

        const div = document.createElement('div');
        div.className = 'item-agendamento';
        div.innerHTML = `
          <div class="info">
            <strong>${item.nome}</strong>
            <p>✂️ ${item.servico}</p>
            <p>📅 ${dataFormatada} às ${item.hora}</p>
            <p>📞 ${item.telefone}</p>
          </div>
          <button class="btn-cancelar" onclick="removerAgendamento(${index})">Excluir</button>
        `;
        listaContainer.appendChild(div);
      });
    }

    // Função ao enviar o formulário
    form.addEventListener('submit', (e) => {
      e.preventDefault();

      const novoAgendamento = {
        nome: document.getElementById('nome').value,
        telefone: document.getElementById('telefone').value,
        servico: document.getElementById('servico').value,
        data: document.getElementById('data').value,
        hora: document.getElementById('hora').value
      };

      const agendamentos = obterAgendamentos();
      agendamentos.push(novoAgendamento);

      localStorage.setItem('barbearia_agendamentos', JSON.stringify(agendamentos));
      
      form.reset();
      renderizarAgendamentos();
      alert('Agendamento realizado com sucesso!');
    });

    // Função para remover um agendamento
    function removerAgendamento(index) {
      if (confirm("Tem certeza que deseja cancelar este agendamento?")) {
        const agendamentos = obterAgendamentos();
        agendamentos.splice(index, 1);
        localStorage.setItem('barbearia_agendamentos', JSON.stringify(agendamentos));
        renderizarAgendamentos();
      }
    }

    // Executa assim que a página é aberta
    renderizarAgendamentos();
  </script>

</body>
</html>
